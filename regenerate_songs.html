<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regenerar songs.json</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0d1425 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-family: 'Orbitron', 'Arial', sans-serif;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(0, 255, 170, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 0, 170, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
            animation: bgPulse 4s ease-in-out infinite;
        }

        @keyframes bgPulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.7;
            }
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 255, 170, 0.03) 0px,
                transparent 1px,
                transparent 2px,
                rgba(0, 255, 170, 0.03) 3px
            );
            pointer-events: none;
            z-index: 0;
            animation: scanlines 8s linear infinite;
        }

        @keyframes scanlines {
            0% {
                transform: translateY(0);
            }
            100% {
                transform: translateY(50px);
            }
        }

        .container-card {
            background: rgba(10, 14, 39, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 
                0 0 30px rgba(0, 255, 170, 0.3),
                0 0 60px rgba(0, 255, 170, 0.1),
                inset 0 0 20px rgba(0, 255, 170, 0.05);
            max-width: 900px;
            width: 100%;
            border: 2px solid rgba(0, 255, 170, 0.4);
            position: relative;
            z-index: 1;
        }

        .container-card::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, 
                #00ffaa, 
                #00d4ff, 
                #ff00aa, 
                #00ffaa
            );
            border-radius: 20px;
            z-index: -1;
            opacity: 0.3;
            filter: blur(10px);
            animation: borderGlow 3s ease-in-out infinite;
        }

        @keyframes borderGlow {
            0%, 100% {
                opacity: 0.3;
            }
            50% {
                opacity: 0.5;
            }
        }

        .container-card::after {
            content: '';
            position: absolute;
            top: 10px;
            right: 10px;
            width: 40px;
            height: 40px;
            border-top: 3px solid #00ffaa;
            border-right: 3px solid #00ffaa;
            box-shadow: 0 0 10px rgba(0, 255, 170, 0.5);
        }

        h1 {
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 
                0 0 10px rgba(0, 255, 170, 0.8),
                0 0 20px rgba(0, 255, 170, 0.5),
                0 0 30px rgba(0, 255, 170, 0.3);
            color: #00ffaa;
            position: relative;
        }

        h1::before {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00ffaa, transparent);
            box-shadow: 0 0 10px rgba(0, 255, 170, 0.5);
        }

        .fa-music {
            filter: drop-shadow(0 0 10px rgba(0, 255, 170, 0.8));
            color: #00ffaa !important;
        }

        .text-light {
            color: #b0e0e6 !important;
        }

        .log-container {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            padding: 20px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            border: 1px solid rgba(0, 255, 170, 0.3);
            box-shadow: 
                inset 0 0 20px rgba(0, 255, 170, 0.1),
                0 0 10px rgba(0, 255, 170, 0.2);
            position: relative;
        }

        .log-container::before {
            content: '';
            position: absolute;
            top: 10px;
            right: 10px;
            width: 30px;
            height: 30px;
            border-top: 2px solid #ff00aa;
            border-right: 2px solid #ff00aa;
            box-shadow: 0 0 8px rgba(255, 0, 170, 0.5);
        }

        .log-container::after {
            content: '';
            position: absolute;
            bottom: 10px;
            left: 10px;
            width: 30px;
            height: 30px;
            border-bottom: 2px solid #ff00aa;
            border-left: 2px solid #ff00aa;
            box-shadow: 0 0 8px rgba(255, 0, 170, 0.5);
        }

        .log-container::-webkit-scrollbar {
            width: 8px;
        }

        .log-container::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 4px;
        }

        .log-container::-webkit-scrollbar-thumb {
            background: rgba(0, 255, 170, 0.5);
            border-radius: 4px;
        }

        .log-entry {
            margin-bottom: 8px;
            padding: 8px 12px;
            border-radius: 6px;
            border-left: 3px solid;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-10px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .log-entry.info {
            background: rgba(0, 212, 255, 0.1);
            border-left-color: #00d4ff;
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.2);
        }

        .log-entry.success {
            background: rgba(0, 255, 170, 0.1);
            border-left-color: #00ffaa;
            box-shadow: 0 0 10px rgba(0, 255, 170, 0.2);
        }

        .log-entry.warning {
            background: rgba(255, 193, 7, 0.1);
            border-left-color: #ffc107;
            box-shadow: 0 0 10px rgba(255, 193, 7, 0.2);
        }

        .log-entry.error {
            background: rgba(255, 0, 170, 0.1);
            border-left-color: #ff00aa;
            box-shadow: 0 0 10px rgba(255, 0, 170, 0.2);
        }

        .stats-card {
            background: rgba(0, 255, 170, 0.05);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 255, 170, 0.3);
            box-shadow: 
                0 0 20px rgba(0, 255, 170, 0.2),
                inset 0 0 20px rgba(0, 255, 170, 0.05);
            position: relative;
        }

        .stats-card::before {
            content: '';
            position: absolute;
            top: 10px;
            left: 10px;
            width: 30px;
            height: 30px;
            border-top: 2px solid #00d4ff;
            border-left: 2px solid #00d4ff;
            box-shadow: 0 0 8px rgba(0, 212, 255, 0.5);
        }

        .stats-card::after {
            content: '';
            position: absolute;
            bottom: 10px;
            right: 10px;
            width: 30px;
            height: 30px;
            border-bottom: 2px solid #00d4ff;
            border-right: 2px solid #00d4ff;
            box-shadow: 0 0 8px rgba(0, 212, 255, 0.5);
        }

        .stats-card h5 {
            color: #00ffaa;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 255, 170, 0.5);
        }

        .stats-card h3 {
            font-size: 2.5rem;
            font-weight: bold;
            text-shadow: 0 0 15px currentColor;
        }

        .stats-card small {
            color: #b0e0e6;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .text-success {
            color: #00ffaa !important;
        }

        .text-warning {
            color: #ffc107 !important;
        }

        .text-info {
            color: #00d4ff !important;
        }

        .text-primary {
            color: #00ffaa !important;
        }

        .btn {
            border-radius: 10px;
            padding: 14px 35px;
            font-size: 16px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            border: 2px solid;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.5s, height 0.5s;
            z-index: -1;
        }

        .btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn::after {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(45deg, transparent, transparent);
            border-radius: 10px;
            z-index: -2;
            transition: all 0.3s ease;
        }

        .btn-generate {
            background: linear-gradient(135deg, rgba(0, 255, 170, 0.2) 0%, rgba(0, 212, 255, 0.2) 100%);
            border-color: #00ffaa;
            color: #00ffaa;
            box-shadow: 
                0 0 20px rgba(0, 255, 170, 0.4),
                inset 0 0 10px rgba(0, 255, 170, 0.2);
        }

        .btn-generate:hover {
            background: linear-gradient(135deg, rgba(0, 255, 170, 0.3) 0%, rgba(0, 212, 255, 0.3) 100%);
            box-shadow: 
                0 0 30px rgba(0, 255, 170, 0.6),
                inset 0 0 20px rgba(0, 255, 170, 0.3);
            transform: translateY(-3px);
            color: #00ffaa;
        }

        .btn-warning {
            background: linear-gradient(135deg, rgba(255, 0, 170, 0.2) 0%, rgba(255, 85, 108, 0.2) 100%);
            border-color: #ff00aa;
            color: #ff00aa;
            box-shadow: 
                0 0 20px rgba(255, 0, 170, 0.4),
                inset 0 0 10px rgba(255, 0, 170, 0.2);
        }

        .btn-warning:hover {
            background: linear-gradient(135deg, rgba(255, 0, 170, 0.3) 0%, rgba(255, 85, 108, 0.3) 100%);
            box-shadow: 
                0 0 30px rgba(255, 0, 170, 0.6),
                inset 0 0 20px rgba(255, 0, 170, 0.3);
            transform: translateY(-3px);
            color: #ff00aa;
        }

        .btn-outline-light {
            background: transparent;
            border-color: rgba(255, 255, 255, 0.3);
            color: #fff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }

        .btn-outline-light:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            transform: translateY(-3px);
            color: #fff;
        }

        .alert {
            border-radius: 10px;
            border: 1px solid;
            padding: 15px 20px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert-success {
            background: rgba(0, 255, 170, 0.1);
            border-color: #00ffaa;
            color: #00ffaa;
            box-shadow: 0 0 20px rgba(0, 255, 170, 0.2);
        }

        .alert-danger {
            background: rgba(255, 0, 170, 0.1);
            border-color: #ff00aa;
            color: #ff00aa;
            box-shadow: 0 0 20px rgba(255, 0, 170, 0.2);
        }

        .spinner-border-sm {
            width: 1rem;
            height: 1rem;
            border-width: 0.15em;
        }

        /* Efeito de pulso nos ícones */
        .fa {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.7;
            }
        }

        /* Responsividade */
        @media (max-width: 768px) {
            .container-card {
                padding: 25px;
            }

            h1 {
                font-size: 1.8rem;
            }

            .btn {
                padding: 12px 25px;
                font-size: 14px;
                margin: 5px 0;
            }
        }
    </style>
</head>

<body>
    <div class="container-card">
        <div class="text-center mb-4">
            <i class="fas fa-music fa-3x mb-3"></i>
            <h1 class="fw-bold">REGENERAR SONGS.JSON</h1>
            <p class="text-light mt-3">Gera automaticamente o arquivo <span style="color: #00ffaa; text-shadow: 0 0 10px rgba(0, 255, 170, 0.5);">songs.json</span> a partir dos arquivos
                <span style="color: #00d4ff; text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);">index.php</span> em cada pasta de músicas</p>
        </div>

        <div id="statsContainer" class="d-none">
            <div class="stats-card">
                <h5 class="mb-3"><i class="fas fa-chart-bar"></i> ESTATÍSTICAS</h5>
                <div class="row text-center">
                    <div class="col-md-3 col-6 mb-3">
                        <h3 id="statProcessed" class="text-success">0</h3>
                        <small>Processadas</small>
                    </div>
                    <div class="col-md-3 col-6 mb-3">
                        <h3 id="statSkipped" class="text-warning">0</h3>
                        <small>Puladas</small>
                    </div>
                    <div class="col-md-3 col-6 mb-3">
                        <h3 id="statCategories" class="text-info">0</h3>
                        <small>Categorias</small>
                    </div>
                    <div class="col-md-3 col-6 mb-3">
                        <h3 id="statSongs" class="text-primary">0</h3>
                        <small>Músicas</small>
                    </div>
                </div>
                <div class="text-center">
                    <p class="mb-0"><i class="fas fa-file"></i> Tamanho: <strong id="statFileSize">0 KB</strong></p>
                </div>
            </div>
        </div>

        <div id="logContainer" class="log-container mb-4 d-none">
            <h5 class="mb-3" style="color: #00ffaa; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px rgba(0, 255, 170, 0.5);"><i class="fas fa-terminal"></i> LOG DE PROCESSAMENTO</h5>
            <div id="logContent"></div>
        </div>

        <div class="text-center">
            <button id="generateBtn" class="btn btn-generate btn-lg text-white" 
                    title="Gera o songs.json aproveitando os index.php existentes">
                <i class="fas fa-sync-alt"></i> Gerar songs.json
            </button>
            <button id="forceGenerateBtn" class="btn btn-warning btn-lg text-white ms-2"
                    title="Regenera TODOS os index.php e depois gera o songs.json">
                <i class="fas fa-redo"></i> Regenerar Tudo
            </button>
        </div>

        <div id="resultMessage" class="mt-4"></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        $(document).ready(function () {
            // Função para processar a geração
            function processGenerate(forceRegenerate = false) {
                const btn = forceRegenerate ? $('#forceGenerateBtn') : $('#generateBtn');
                const originalHtml = btn.html();

                // Desabilitar botões
                $('#generateBtn, #forceGenerateBtn').prop('disabled', true);
                
                // Mostrar loading no botão clicado
                btn.html('<span class="spinner-border spinner-border-sm me-2"></span>Gerando...');

                // Limpar resultados anteriores
                $('#resultMessage').empty();
                $('#logContent').empty();
                $('#statsContainer').addClass('d-none');
                $('#logContainer').removeClass('d-none');

                // Construir URL com parâmetro force se necessário
                const url = forceRegenerate ? 'api_generate_songs.php?force=true' : 'api_generate_songs.php';

                // Fazer requisição AJAX
                $.ajax({
                    url: url,
                    method: 'GET',
                    dataType: 'json',
                    timeout: 600000, // 10 minutos
                    success: function (response) {
                        console.log('Resposta:', response);

                        // Mostrar log
                        if (response.log && response.log.length > 0) {
                            response.log.forEach(function (entry) {
                                addLogEntry(entry.time, entry.type, entry.message);
                            });
                        }

                        // Mostrar estatísticas
                        if (response.stats) {
                            $('#statProcessed').text(response.stats.processed || 0);
                            $('#statSkipped').text(response.stats.skipped || 0);
                            $('#statCategories').text(response.stats.total_categories || 0);
                            $('#statSongs').text(response.stats.total_songs || 0);
                            $('#statFileSize').text(response.stats.file_size || '0 KB');
                            $('#statsContainer').removeClass('d-none');
                        }

                        // Mostrar mensagem de resultado
                        if (response.success) {
                            const message = forceRegenerate 
                                ? 'O arquivo songs.json foi gerado com sucesso e todos os index.php foram regenerados!'
                                : 'O arquivo songs.json foi gerado com sucesso.';
                            
                            $('#resultMessage').html(`
                                <div class="alert alert-success">
                                    <i class="fas fa-check-circle"></i>
                                    <strong>Sucesso!</strong> ${message}
                                </div>
                            `);
                        } else {
                            $('#resultMessage').html(`
                                <div class="alert alert-danger">
                                    <i class="fas fa-exclamation-circle"></i>
                                    <strong>Erro!</strong> ${response.error || 'Falha ao gerar songs.json'}
                                </div>
                            `);
                        }

                        // Restaurar botões
                        $('#generateBtn, #forceGenerateBtn').prop('disabled', false);
                        btn.html(originalHtml);
                    },
                    error: function (xhr, status, error) {
                        console.error('Erro:', error);

                        $('#resultMessage').html(`
                            <div class="alert alert-danger">
                                <i class="fas fa-exclamation-triangle"></i>
                                <strong>Erro!</strong> Falha na comunicação com o servidor: ${error}
                            </div>
                        `);

                        // Restaurar botões
                        $('#generateBtn, #forceGenerateBtn').prop('disabled', false);
                        btn.html(originalHtml);
                    }
                });
            }

            // Botão de geração normal
            $('#generateBtn').click(function () {
                processGenerate(false);
            });

            // Botão de regeneração forçada
            $('#forceGenerateBtn').click(function () {
                if (confirm('Isso irá regenerar TODOS os arquivos index.php em todas as pastas. Continuar?')) {
                    processGenerate(true);
                }
            });

            function addLogEntry(time, type, message) {
                const icons = {
                    'info': 'fa-info-circle',
                    'success': 'fa-check-circle',
                    'warning': 'fa-exclamation-triangle',
                    'error': 'fa-times-circle'
                };

                const icon = icons[type] || 'fa-info-circle';

                const entry = $(`
                    <div class="log-entry ${type}">
                        <i class="fas ${icon}"></i>
                        <span class="text-muted">[${time}]</span>
                        ${message}
                    </div>
                `);

                $('#logContent').append(entry);

                // Auto-scroll para o final
                $('#logContainer').scrollTop($('#logContainer')[0].scrollHeight);
            }
        });
    </script>
</body>

</html>
